spring:
  application:
    name: jreg0
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
  cors:
    origin: ${FRONT_URL}
